spring.application.name=perussi

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/perussi
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.servlet.path=/api

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.notification-url=https://unshaken-nebulizer-pessimist.ngrok-free.dev/api/webhooks/mercadopago