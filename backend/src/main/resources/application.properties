spring.application.name=perussi
spring.config.import=optional:file:./mercadopago.local.properties

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5433/perussi
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.servlet.path=/api

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.creation-api=${MERCADOPAGO_CREATION_API:payments}
mercadopago.orders-access-token=${MERCADOPAGO_ORDERS_ACCESS_TOKEN:}
mercadopago.orders-webhook-secret=${MERCADOPAGO_ORDERS_WEBHOOK_SECRET:}
pedidos.reserva.minutos=${RESERVA_MINUTOS:30}
pedidos.reserva.verificacao-ms=60000
security.jwt.secret=${JWT_SECRET}

# Recovery remains disabled until an authenticated email provider is configured.
recuperacao.habilitada=${RECUPERACAO_HABILITADA:false}
recuperacao.remetente=${RECUPERACAO_REMETENTE:}
recuperacao.url-site=${RECUPERACAO_URL_SITE:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
